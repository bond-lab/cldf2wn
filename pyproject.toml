[project]
name = "cldf2wn"
version = "0.1.0"
description = "Convert CLDF wordlists into WN-LMF wordnets via Concepticon and the ILI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "wn>=1.1"]

[project.scripts]
cldf2wn = "cldf2wn.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cldf2wn"]

[tool.ruff]
line-length = 96

[tool.pytest.ini_options]
markers = ["integration: exercises the wn library against a temporary data directory"]
